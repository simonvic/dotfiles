<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

	<description>https://github.com/simonvic/dotfiles</description>


	<!-- SANS SERIF -->
	<alias binding="strong">
		<family>sans-serif</family>
		<prefer>
			<family>Lato</family>
		</prefer>
	</alias>


	<!-- SERIF -->
	<alias binding="strong">
		<family>serif</family>
		<prefer>
			<family>LiberationSerif</family>
		</prefer>
	</alias>


	<!-- MONOSPACE -->
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>Source Code Pro</family>
			<family>SauceCodePro NFP</family>
		</prefer>
	</alias>


	<!-- PATCHED NERD FONT -->
	<alias binding="strong">
		<family>nerdfont</family>
		<prefer>
			<family>SauceCodePro NFP</family>
		</prefer>
	</alias>


</fontconfig>
